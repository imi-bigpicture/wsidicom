[project]
name = "wsidicom"
version = "0.36.1"
description = "Tools for handling DICOM based whole scan images"
authors = [
    {name = "Erik O Gabrielsson", email = "erik.o.gabrielsson@sectra.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["whole slide image", "digital pathology", "annotations", "dicom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.22.0",
    "pydicom>=3.0.0",
    "Pillow>=9.1.1",
    "dicomweb-client>=0.61.0",
    "marshmallow>=4.0.0",
    "fsspec>=2024.2.0",
    "universal-pathlib>=0.3.0",
    "cachetools>=7.1.3",
]

[project.optional-dependencies]
imagecodecs = ["imagecodecs>=2024.1.1,!=2024.9.22"]
pylibjpeg-rle = ["pylibjpeg-rle>=2.0.0,<3.0.0"]
pyjpegls = ["pyjpegls>=1.2.0,<2.0.0"]
pylibjpeg-openjpeg = ["pylibjpeg-openjpeg>=2.1.1,<3.0.0"]
opencv = ["opencv-python-headless>=4.5.0"]
# SIMD resampling, box reduction and compositing (Rust; see kernels/), released
# on its own from this repository.
kernels = ["wsidicom-kernels>=0.1.0,<0.2.0"]

[dependency-groups]
dev = [
    "pytest>=7.2.0,<10.0.0",
    "xmltodict>=0.12.0,<1.1.0",
    "shapely>=2.0.2,<3.0.0",
    "ruff>=0.16.3",
    "pyright>=1.1.409",
    "wsidicom-data>=0.3.0,<0.4.0",
    "decoy>=2.2.0,<3.0.0",
    "pytest-testmon>=2.2.0",
    "pytest-watcher>=0.6.3",
    "typos>=1.48.0",
]

[project.urls]
Repository = "https://github.com/imi-bigpicture/wsidicom"

[tool.uv]
exclude-newer = "14 days"

[tool.uv.workspace]
members = ["kernels"]

[tool.uv.sources]
wsidicom-kernels = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 88
# The compiled module's hand-written stub; not linted as source.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes (replaces the old flake8 dep)
# I: import sorting, UP: pyupgrade, B: bugbear, SIM: simplify
# S: flake8-bandit security rules (the free SAST baseline)
# ANN: type annotations, PT: pytest style, N: pep8 naming, RUF: ruff's own,
# D: docstring format (numpy convention)
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ANN", "PT", "N", "RUF", "D"]
ignore = [
    # Asserts are used throughout for type narrowing and internal invariants.
    "S101",
    # Any is needed where values are genuinely untyped (e.g. NDArray[Any]).
    "ANN401",
    # Local constants are written in capitals.
    "N806",
    # Public exception names are API; renaming them would break callers.
    "N818",
    # Docstrings where a name needs one, not on every public item.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use hardcoded credentials (S105/S106), pseudo-random test
# data (S311), md5 for image-hash comparison (S324), file handles whose lifetime
# is managed by a fixture/wrapper rather than a context manager (SIM115), and long
# lines from embedded test data such as base64 blobs, URLs, and checksums (E501).
"tests/**" = ["S105", "S106", "S311", "S324", "SIM115", "E501"]
"kernels/tests/**" = ["S311"]
# Benchmarks: long report lines beat wrapped ones, and bench_avx512 spawns its
# own interpreter per measurement (S603).
"kernels/bench/**" = ["E501", "E226", "SIM108", "S603", "S311", "ANN", "D", "PT", "N"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
# The tests' style: a list of names, a list of tuples.
parametrize-names-type = "list"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[tool.typos.default.extend-words]
Professer = "Professer"
SEH = "SEH"
PN = "PN"
# pyvips affine() output offsets (odx, ody).
ody = "ody"
# numpy's flag name (ndarray.flags.writeable).
writeable = "writeable"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# wsidicom-kernels is its own distribution, built from kernels/.
exclude = ["kernels"]

[tool.pytest-watcher]
now = true
runner = "pytest"
runner_args = ["--testmon"]
ignore_patterns = [".venv/*"]
