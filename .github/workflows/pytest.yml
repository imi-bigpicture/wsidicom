name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cache_test_images:
    name: cache test images
    runs-on: ubuntu-latest
    steps:
      - name: Prevent cache-miss on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Load test images from cache
        id: cache-test-images
        uses: actions/cache@v6
        with:
          key: test-images-cache-${{ hashFiles('tests/download_test_images.py') }}
          restore-keys: |
            test-images-cache-
          path: tests/testdata/slides
          enableCrossOsArchive: true
          # Only check that the entry exists; the test jobs download it.
          lookup-only: true
      - name: Download test images
        if: ${{ steps.cache-test-images.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python tests/download_test_images.py

  tests:
    needs: [cache_test_images]
    name: pytest ${{ matrix.os }}::py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # Every supported Python on Linux; oldest and newest on macOS and Windows.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Prevent cache-miss on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Load test images from cache
        uses: actions/cache@v6
        with:
          key: test-images-cache-${{ hashFiles('tests/download_test_images.py') }}
          path: tests/testdata/slides
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # Pull requests restore main's cache; saving their own only crowds it out.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Application
        run: uv sync --all-extras
      - name: Test with pytest.
        run: uv run pytest

  kernels-tests:
    name: kernels pytest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and aarch64 (NEON) on Linux, Apple silicon, and Windows. The
        # extension is abi3, so one Python version covers them all.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      # --all-packages for the kernels dev group (Hypothesis).
      - name: Install Application
        run: uv sync --all-extras --all-packages
      - name: Test with pytest.
        run: uv run --all-packages pytest kernels/tests

  rust-tests:
    name: cargo test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (AVX2 kernels where the runner has them) and
        # aarch64 (NEON) on Linux, Apple silicon, and Windows.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: kernels
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # The test binary links the Python library (PyO3 without
      # extension-module).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # A debug build: debug assertions and the standard library's checks on
      # unchecked accesses are on, so an out-of-bounds kernel access fails.
      - name: Cargo test
        run: cargo test --lib
        env:
          PYO3_PYTHON: python
